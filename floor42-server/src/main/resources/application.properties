# The daemon only ever listens on loopback (ADR-0007).
quarkus.http.host=127.0.0.1
quarkus.http.port=7420
quarkus.http.test-port=0
# Dev mode (bin/floor42-dev) listens on its own port, so it runs next to an installed daemon on 7420.
%dev.quarkus.http.port=7421
# A change inside a method body is swapped into the running daemon (no restart, the journal and sessions stay); a
# change of shape (a new field, method or class) still restarts the application, in a few seconds.
%dev.quarkus.live-reload.instrumentation=true
# The director gives a mission up to 20 MB of files at once, sent in base64.
quarkus.http.limits.max-body-size=30M


# Web UI lives in its own folder at the repository root.
quarkus.quinoa.ui-dir=../floor42-web
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/ws,/q,/hooks
# The page itself is never cached: see PageCache.

# The API documents itself (OpenAPI at /q/openapi, Swagger UI at /q/swagger-ui), loopback only like the rest, and for
# the director only: the signed-in browser's cookie (the top bar's Docs link) or a script token as a bearer. "Try it
# out" works from the signed-in browser through the session cookie. Dev mode opens /q/ (its dev UI lives there).
%dev.floor42.access.open-quarkus-pages=true
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=Floor42 API
# "Try it out" sends the anti-CSRF header the access guard requires of a browser's cookie on any change (ADR-0044).
quarkus.swagger-ui.request-interceptor=function(request) { request.headers['X-Floor42-Request'] = '1'; return request; }
quarkus.smallrye-openapi.info-title=Floor42 API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-license-name=Apache-2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.txt
mp.openapi.filter=dev.floor42.server.api.OpenApiSecurity

# Before each agent session, Floor42 holds it when a usage window of the plan, plus what a session adds, would reach
# this fraction (readings measured by Claude Code; the increase is an estimate).
floor42.plan-limit.threshold=0.9
# Cost cap of one agent session in USD (default 2.0); the director's saved setting wins. A mission's remaining budget can lower it.
#floor42.session.budget-usd=2.0
# Minutes a mission may show no sign of life, with work ready to start, before it is reported stuck (default 5); the
# director's saved setting wins.
#floor42.stall.minutes=5
# Set to false only in tests that drive the runtime by hand: nothing reacts to events and nothing is recovered at start (default true).
#floor42.live-missions.enabled=true
# Seconds a mission's checks may run before the whole process tree is stopped (default 900).
#floor42.checks.timeout-seconds=900

# The director's sign-in (ADR-0034). The token stays in memory; true writes it to session.token for scripts, and
# unconfined agents can then read it. The sign-in link goes to the browser (browser), or to standard output (stdout,
# Docker), never to the caller.
floor42.director-token-file=false
floor42.sign-in.delivery=browser
%test.floor42.sign-in.delivery=none
# Dev mode prints the link in its console: the browser that should open it may be the one already on 7420.
%dev.floor42.sign-in.delivery=stdout
# floor42.director-token-file is deprecated (ADR-0044): it still works, with a warning; issue a script token from the
# desk instead (System > Sessions and tokens), scoped and expiring, never written to a file.

# The director's sessions (ADR-0044), in memory only: a browser session ends after this long unused, or this long
# after its sign-in, whichever comes first. Script tokens carry their own expiry (at most 30 days).
floor42.sessions.idle-hours=8
floor42.sessions.absolute-hours=24
# Origins allowed besides the daemon's own (http:// plus the request's Host, exactly). Only dev mode needs any: the
# Vite server and the dev launcher's port. Never add another page's origin: it could then drive the daemon.
#floor42.access.extra-origins=
%dev.floor42.access.extra-origins=http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:7421,http://localhost:7421

# Company data: the event journal (SQLite) and the agents' worktrees. One directory per company.
floor42.data-dir=${user.home}/.floor42
%dev.floor42.data-dir=${user.home}/.floor42-dev
# Logs: console as ever, and a file in <data-dir>/logs (Quarkus creates the folder), 10 MB each, 5 old ones kept; a
# start rotates the previous run's file first, so the log of a crash survives a restart. No secret is ever logged.
quarkus.log.file.enabled=true
quarkus.log.file.path=${floor42.data-dir}/logs/floor42.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.rotate-on-boot=true
%test.quarkus.log.file.enabled=false
%test.quarkus.log.file.path=target/test-logs/floor42.log
%test.floor42.data-dir=target/test-data/${floor42.test.boot-id:${quarkus.uuid}}
# Office's data folder before 1.5.0: on the first start without floor42.db, its office.db is copied (never moved) and
# its worktrees stay where they are. The folder itself is left intact, as a backup. Tests never read the machine's own.
floor42.legacy-data-dir=${user.home}/.office
%dev.floor42.legacy-data-dir=${user.home}/.office-dev
%test.floor42.legacy-data-dir=target/no-legacy-data
# A command that applied events then failed is rolled back from the journal (OfficeService); tests fail loudly on it.
%test.floor42.office.fail-on-rollback=true

# Copies of the journal (ADR-0042): one at every start (before migration and replay), one a day, one on demand, each
# SQLite's own consistent snapshot. Kept in <data-dir>/backups unless set; never inside a worktree or a git work tree
# (copies are then turned off, loudly). Restore: docs/backups.md. Tests copy to the temporary folder, never ~/.floor42.
floor42.backup.enabled=true
#floor42.backup.dir=
floor42.backup.startup-keep=5
floor42.backup.daily-keep=7
floor42.backup.manual-keep=5
floor42.backup.check-minutes=60
%test.floor42.backup.dir=${java.io.tmpdir}/floor42-test-backups/${floor42.test.boot-id:${quarkus.uuid}}

quarkus.datasource.db-kind=sqlite
# Fixed: ConfigGuard refuses to start with any other URL, any added driver property or SQLite's extension loading.
# IMMEDIATE: an append takes the write lock when its transaction begins. Another process holding the journal (a sqlite3
# shell, a database browser) makes an append fail after SQLite's 3 s busy timeout, with JOURNAL_LOCKED (docs/backups.md).
quarkus.datasource.jdbc.url=jdbc:sqlite:${floor42.data-dir}/floor42.db?transaction_mode=IMMEDIATE
quarkus.datasource.jdbc.max-size=4
# The journal migrates the schema itself, after creating the data directory.
quarkus.flyway.migrate-at-start=false

# Tests never run the real Claude Code: a protocol-faithful fake plays a scripted session (see FakeClaude.java). The
# tests compile it once per run into target/fakes (FakeTools): a start takes 0.08 s instead of 0.8 s from the source.
%test.floor42.claude.command=java,-cp,target/fakes/fake-claude.jar,FakeClaude,--fake-script,src/test/resources/fake-claude/session.txt,--fake-review-script,src/test/resources/fake-claude/review.txt
%test.floor42.claude.hook-timeout-seconds=30
# The director's meeting (ADR-0047): how long an attendee's session may take to end its turn after its next tool call
# was refused, before Floor42 stops it between two calls.
floor42.meeting.wind-down=PT2M
%test.floor42.meeting.wind-down=PT3S
%test.floor42.meeting.longest-silent-call=PT3S
# A subagent (Task) or an MCP tool may run long with no heartbeat proven: its silence is allowed much longer.
floor42.meeting.longest-silent-long-call=PT30M
%test.floor42.meeting.longest-silent-long-call=PT30M
# Dev mode plays the same fake by default (launched from its source: no test build needed), so no session is ever
# paid by accident. The real one is an opt-in: bin/floor42-dev --real-claude (-Dfloor42.claude.command=claude).
%dev.floor42.claude.command=java,src/test/resources/fake-claude/FakeClaude.java,--fake-script,src/test/resources/fake-claude/session.txt,--fake-review-script,src/test/resources/fake-claude/review.txt
# A REAL Claude Code mission needs the WSL sandbox unless the director switched unsafe mode on (ADR-0063, D16). The fakes
# of tests and dev mode are exempt; bin/floor42-dev --real-claude turns it back on.
# Test hook: when set, the sandbox is taken as working (true) or not (false) without probing WSL. Unset by default (the
# probe measures it). Never set it in production: true on a machine without a working WSL hides that the sandbox is gone.
#floor42.sandbox.assume-available=
floor42.sandbox.mandatory=true
%test.floor42.sandbox.mandatory=false
%dev.floor42.sandbox.mandatory=false
%test.floor42.plan-limit.resume-margin-seconds=1
# Retrospectives run only in the test that checks them: elsewhere they would add sessions to missions under test.
%test.floor42.retro.enabled=false
# An acceptance asks about an unproven delivery (ADR-0058): off in tests but ProofApiTest's, like retrospectives.
%test.floor42.proof.required=false

# Skills and agents (W3): the user level read for the catalogue (default ~/.claude, the one Floor42's sessions use),
# and folders that links inside it may point into and still be read, comma-separated (none by default: a link out of
# ~/.claude/skills or ~/.claude/agents is listed, not read). Tests read an empty folder, never the machine's own.
#floor42.catalogue.claude-home=
#floor42.catalogue.trusted-roots=
%test.floor42.catalogue.claude-home=target/test-claude-home
# Pull requests (ADR-0036): GitHub's command line, signed in by the director; Floor42 never signs in nor stores a token.
floor42.gh.command=gh
floor42.gh.timeout-seconds=60
# Tests never reach GitHub: no gh at all, unless a test swaps in the fake one (FakeGh.java).
%test.floor42.gh.command=floor42-no-gh-in-tests
# Plugins (ADR-0040): Claude Code's own command line, run only on the director's confirmed click; Floor42's own folder
# for the "for Floor42 only" target (default <data>/claude-assets, its Claude Code configuration in config/); where a
# marketplace's listing is read from on the director's click.
floor42.plugins.claude-command=claude
floor42.plugins.timeout-seconds=300
#floor42.plugins.dir=
floor42.plugins.listing-base=https://raw.githubusercontent.com
# Tests never run the real claude nor reach the network: no command, and a listing base nothing answers.
%test.floor42.plugins.claude-command=floor42-no-claude-in-tests
%test.floor42.plugins.listing-base=http://127.0.0.1:9

# The director's own terminal (ADR-0041): their own Claude Code, started on their click with no Floor42 flag or hook.
# Only --settings is added, with a status line that copies the cost Claude Code reports, then runs their own status line.
floor42.terminal.command=claude
floor42.terminal.cost-from-status-line=true
# Tests never start Claude Code: a fake interactive program answers in the terminal (FakeTty.java).
%test.floor42.terminal.command=java,src/test/resources/fake-tty/FakeTty.java
%test.floor42.terminal.claude-home=target/test-claude-home
# The terminal calls ConPTY / the C library through the JDK's foreign function API: allowed without a warning.
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED

# Agent identity (IAM mode, opt-in, off by default). Settings are saved in <data-dir>/iam/settings.json from the UI; a property
# below, when set, wins over the file (tests, scripts). Turning it on or off takes a restart. Needs the WSL sandbox.
#floor42.iam.enabled=false
#floor42.iam.issuer=http://localhost:8180/realms/floor42
#floor42.iam.max-token-hours=8
