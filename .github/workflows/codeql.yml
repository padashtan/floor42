name: CodeQL

# Code scanning with the security-extended queries, on every push to main, every pull request and weekly. Results go
# to the repository's Security tab (code scanning), which is free for a public repository only: the job is skipped on a
# private repository, where the upload is refused (docs/security-scanning.md).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    # Only in the public repository (its name holds for every event, schedule included): a copy without Advanced Security cannot upload (docs/security-scanning.md).
    if: ${{ github.repository == 'padashtan/floor42' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # the analysis reads the workflow run
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # The web UI is JavaScript for the other matrix entry: no Quinoa build, no format check, no tests here.
      - name: Build the Java modules
        if: matrix.language == 'java-kotlin'
        run: ./mvnw -B -ntp -q package -DskipTests -Dspotless.check.skip=true -Dquarkus.quinoa=false

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
