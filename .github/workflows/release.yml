name: Release

# On a tag vX.Y.Z whose commit sets that version in pom.xml and has a "## [X.Y.Z]" section in CHANGELOG.md:
#   build    runs the full gate, packs floor42-X.Y.Z.zip and the two CycloneDX SBOMs (Java and web);
#   security the Trivy gate and the Semgrep report (security-scan.yml, docs/security-scanning.md);
#   publish  only when build and security passed: attests (build provenance) the zip, the SBOMs and the image, publishes the GitHub
#            Release, and pushes ghcr.io/padashtan/floor42:X.Y.Z (and :latest, for a final version only).
# The browser journeys are not run here: GitHub's runners have no GPU and the 3D scene is too slow under software
# WebGL. They are the release gate on the developer machine, on Windows and Linux, before the tag (docs/releases.md).
# The image is the Dockerfile's `floor42` target: the office and the
# simulated demo, without Claude Code (Anthropic's software is not redistributed; docs/docker.md). How to verify what
# was published: docs/releases.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # padashtan/floor42 on every event; any other copy (a fork) only when run by hand, to spare its Actions minutes.
    if: ${{ github.repository == 'padashtan/floor42' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: floor42-web/package-lock.json

      - name: Check the tag against pom.xml and the changelog
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          pom=$(./mvnw -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$pom" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but pom.xml says $pom"
            exit 1
          fi
          # The section's lines, up to the next version or the link references at the end.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (index($0, "## [") == 1 || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section ## [$version]"
            exit 1
          fi
          # A version with a hyphen (1.9.0-rc.1) is a prerelease: a GitHub prerelease, and never the image's :latest.
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Install web dependencies
        run: npm ci
        working-directory: floor42-web

      - name: Web unit tests
        run: npm test
        working-directory: floor42-web

      # Format, build, every test. No test may call a paid model (ADR-0006). The archives take the tagged commit's own
      # time (reproducible builds); the aggregate CycloneDX SBOM is written to target/bom.json by the package phase.
      # Two test JVMs of 2 GB, as ci.yml: the default six forks run a 2 vCPU, 7 GB runner out of memory (a 1.0.0-rc.1
      # rehearsal was killed there after 17 minutes).
      - name: Build and test
        run: ./mvnw -B -ntp verify "-Dfloor42.test.forks=2" "-Dfloor42.test.heap=2g" "-Dproject.build.outputTimestamp=$(git log -1 --format=%cI)"

      # The tests tagged slow, left out of verify (docs/releases.md).
      - name: Slow tests
        run: ./mvnw -B -ntp -pl floor42-server -am test -Pslow -Dspotless.check.skip=true -Dquarkus.quinoa=false "-Dfloor42.test.forks=2" "-Dfloor42.test.heap=2g"

      - name: Package the zip and the SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release-files
          # The web part: the production dependencies of the lock file, with npm's own CycloneDX writer.
          # Written before packing: package-release builds THIRD-PARTY-LICENSES.txt from both SBOMs.
          (cd floor42-web && npm sbom --sbom-format cyclonedx --sbom-type application --omit dev) \
            > "release-files/floor42-$VERSION-sbom-web.cdx.json"
          cp target/bom.json "release-files/floor42-$VERSION-sbom-java.cdx.json"
          FLOOR42_SBOM_WEB="$PWD/release-files/floor42-$VERSION-sbom-web.cdx.json" \
            SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bin/package-release "$VERSION" release-files
          cp release-notes.md release-files/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files
          if-no-files-found: error
          retention-days: 7


  # Trivy on the lock files, the SBOM, the compose and Docker files and the image: a HIGH or CRITICAL finding that
  # .trivyignore does not list fails the release (docs/security-scanning.md).
  security:
    needs: build
    uses: ./.github/workflows/security-scan.yml
    with:
      release: true

  publish:
    needs: [build, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub Release
      packages: write # the image in ghcr.io
      id-token: write # the signing identity of the attestations
      attestations: write
    env:
      IMAGE: ghcr.io/padashtan/floor42
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      # Signed provenance: the workflow, the commit and the runner that built each file, in the repository's
      # attestations (gh attestation verify, docs/releases.md).
      - name: Attest the zip and the SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-files/floor42-${{ env.VERSION }}.zip
            release-files/floor42-${{ env.VERSION }}-sbom-java.cdx.json
            release-files/floor42-${{ env.VERSION }}-sbom-web.cdx.json

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Floor42 ${{ env.VERSION }}
          body_path: release-files/release-notes.md
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: |
            release-files/floor42-${{ env.VERSION }}.zip
            release-files/floor42-${{ env.VERSION }}.zip.sha256
            release-files/floor42-${{ env.VERSION }}-sbom-java.cdx.json
            release-files/floor42-${{ env.VERSION }}-sbom-web.cdx.json
          fail_on_unmatched_files: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The commit's time, for the image's /api/status
        id: commit
        run: echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      # :latest moves only for a final version; a prerelease keeps its own tag.
      - name: Build and push the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: floor42
          push: true
          # The attestation below is the provenance; buildkit's own would add a second, unsigned one to the index.
          provenance: false
          sbom: false
          # The image's /api/status names the commit it was built from (build.commit; bin/build-commit-properties).
          build-args: |
            FLOOR42_COMMIT=${{ github.sha }}
            FLOOR42_COMMIT_TIME=${{ steps.commit.outputs.time }}
            FLOOR42_COMMIT_DIRTY=false
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ needs.build.outputs.prerelease == 'false' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
