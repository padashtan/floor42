name: OpenSSF Scorecard

# Weekly supply-chain score of the repository (branch protection, pinned actions, signed releases, SAST, ...).
# publish_results sends the score to the public OpenSSF API for the badge, and the action refuses a private
# repository: the job is skipped until the repository is public (docs/security-scanning.md). Until then, run it by hand
# locally: `docker run --rm -e GITHUB_AUTH_TOKEN gcr.io/openssf/scorecard --repo=github.com/padashtan/floor42`.
on:
  schedule:
    - cron: '31 5 * * 2'
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions: read-all

jobs:
  analysis:
    # Only in the public repository (its name holds for every event, schedule included): the private one has no Advanced Security (docs/security-scanning.md).
    if: ${{ github.repository == 'padashtan/floor42' }}
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload of the SARIF result to code scanning
      id-token: write # publish_results: the signed publication to the OpenSSF API
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
