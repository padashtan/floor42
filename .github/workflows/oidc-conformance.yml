name: OIDC conformance

# Floor42's OIDC sign-in against the OpenID Foundation conformance suite (relying party tests, prebuilt Docker images
# pinned by digest in tools/conformance/compose.yaml). By hand only: it pulls about 1.5 GB of images and takes
# a few minutes. docs/oidc-conformance.md.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Conformance run
        run: make oidc-conformance

      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oidc-conformance
          path: target/oidc-conformance/results.*
          if-no-files-found: ignore
