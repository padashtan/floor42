worker_processes 1;
events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log  /dev/stderr;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /tls/suite.crt;
    ssl_certificate_key /tls/suite.key;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    resolver 127.0.0.11 ipv6=off;
    server {
        listen 8443 ssl;
        server_name localhost;
        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;
        # Floor42 derives Keycloak's endpoint paths from the issuer (no discovery): map them to the suite's.
        rewrite ^(/test/a/[^/]+)/protocol/openid-connect/auth$  $1/authorize last;
        rewrite ^(/test/a/[^/]+)/protocol/openid-connect/token$ $1/token last;
        rewrite ^(/test/a/[^/]+)/protocol/openid-connect/certs$ $1/jwks last;
        location / {
            proxy_pass http://server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;
            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header Forwarded "by=$server_addr;for=$remote_addr;host=$host;proto=$scheme";
        }
    }
}
