# The OpenID Foundation conformance suite, prebuilt images pinned by digest (no build), on 127.0.0.1:8443 only.
# nginx.conf is the suite's own 8443 server plus the three rewrites Floor42 needs (see docs/oidc-conformance.md).
name: floor42-oidc-conformance
services:
  mongodb:
    image: mongo@sha256:b415b12f638e2685d06c58ab7fb5943577c50fadec6d9340ef67d21aeac72070
    tmpfs: [/data/db]
  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx@sha256:4a0180d96e323d1985ba31b6a3cb93f80fac7f16ed3cd784431462004f21ba53
    ports: ["127.0.0.1:8443:8443"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro", "${FLOOR42_TLS_DIR:?run tools/conformance/suite.sh}:/tls:ro"]
    networks:
      default:
        aliases: [localhost.emobix.co.uk]
    depends_on: [server]
  server:
    image: registry.gitlab.com/openid/conformance-suite@sha256:fc9a8160ad3edb7b4ad18c8a670b5a7836970ed2b2358205e4d343bbedd134e9
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      OIDC_GOOGLE_CLIENTID: unused
      OIDC_GOOGLE_SECRET: unused
      OIDC_GITLAB_CLIENTID: unused
      OIDC_GITLAB_SECRET: unused
    depends_on: [mongodb]
