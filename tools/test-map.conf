# The test map (ADR-0068): which tests a changed path calls for. Read by TestMap.java (server test sources), which
# bin/floor42-quick and the gate's escape survey run; TestMapGateTest keeps it honest.
#
#   <glob> = <target> ...     the first rule whose glob matches a path wins; a path no rule matches calls for everything
#   core = <target> ...       runs with every Java selection
#   e2e-of <context> = <term> ...   the browser journeys of a server context, for the target e2e-of:{ctx}
#
# Globs: ** crosses folders, * stays in one, {ctx} and {name} capture one name and may be used in the targets.
# Targets: java:<Surefire pattern> or java:all, web:related or web:all (Vitest), e2e:<Playwright grep term> or e2e:all,
# e2e-of:<context>, none. A continuation line starts with a space.

core = java:dev/floor42/server/*Test java:*ContractTest java:*CharacterisationTest java:dev/floor42/domain/**

e2e-of mission   = @tickets @reports
e2e-of delivery  = @delivery
e2e-of committee = @meetings
e2e-of workspace = @projects
e2e-of session   = @office
e2e-of asset     = @plugins
e2e-of cost      = @plugins
e2e-of terminal  = @plugins
e2e-of demo      = @ui
e2e-of console   = @settings
e2e-of office    = @office
e2e-of gateway   = @iam

# Notes and documents: no test, except the file the debt gate reads.
docs/DEBT.md = java:DebtGateTest
docs/** = none
*.md = none
tools/test-map.conf = java:TestMapGateTest

# A changed test class runs alone.
floor42-*/src/test/java/**/{name}Test.java = java:{name}Test

# The shared core of the server: everything Java. Main and test sources alike (src/*/java).
floor42-server/src/*/java/dev/floor42/server/app/core/** = java:all
floor42-server/src/*/java/dev/floor42/server/app/boot/** = java:all
floor42-server/src/*/java/dev/floor42/server/api/event/** = java:all
floor42-server/src/*/java/dev/floor42/server/api/journal/** = java:all
floor42-server/src/*/java/dev/floor42/server/api/* = java:all

# Identity: its own packages and the gateway that checks its tokens.
floor42-server/src/*/java/dev/floor42/server/iam/** = java:dev/floor42/server/iam/** java:dev/floor42/server/api/iam/**
 java:dev/floor42/server/api/gateway/** e2e:@iam
floor42-server/src/*/java/dev/floor42/server/api/iam/** = java:dev/floor42/server/iam/** java:dev/floor42/server/api/iam/**
 e2e:@iam

# HTTP contexts with no application context of the same name.
floor42-server/src/*/java/dev/floor42/server/api/console/** = java:dev/floor42/server/api/console/** e2e-of:console
floor42-server/src/*/java/dev/floor42/server/api/gateway/** = java:dev/floor42/server/api/gateway/** e2e-of:gateway
floor42-server/src/*/java/dev/floor42/server/api/office/** = java:dev/floor42/server/api/office/** e2e-of:office

# A feature context (ADR-0067): its application and HTTP packages together. A new context needs no line here, only
# its journeys above.
floor42-server/src/*/java/dev/floor42/server/app/{ctx}/** = java:dev/floor42/server/app/{ctx}/**
 java:dev/floor42/server/api/{ctx}/** e2e-of:{ctx}
floor42-server/src/*/java/dev/floor42/server/api/{ctx}/** = java:dev/floor42/server/app/{ctx}/**
 java:dev/floor42/server/api/{ctx}/** e2e-of:{ctx}

# The rest of the Java build: config, journal, runtime, security, test helpers, resources, the domain, the poms.
floor42-server/** = java:all
floor42-domain/** = java:all
pom.xml = java:all

# The web application. Vitest follows the imports of the changed files; journeys by API domain where one is known.
floor42-web/e2e/{name}.e2e.ts = e2e:{name}.e2e.ts
floor42-web/e2e/** = e2e:all
floor42-web/src/api/types.dossier.ts = web:related e2e:@reports
floor42-web/src/api/types.{ctx}.ts = web:related e2e:@{ctx}
floor42-web/src/scene/** = web:related e2e:@scene
floor42-web/src/** = web:related e2e:all
floor42-web/** = web:all e2e:all
