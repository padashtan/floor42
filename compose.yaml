# Floor42 with Docker Engine in WSL 2 or on Linux: see docs/docker.md.
#   FLOOR42_PROJECTS=$HOME/code docker compose up -d     (FLOOR42_PORT changes the port, 7420 by default)
#
# By default this runs the published image, ghcr.io/padashtan/floor42: the office and the simulated demo, without
# Claude Code (Anthropic's software is never redistributed). When the image cannot be pulled, compose builds it here.
# For real agents, `make docker-up` (bin/floor42-docker) builds the image with Claude Code on your machine instead and
# names it floor42:local (FLOOR42_IMAGE).
services:
  floor42:
    image: ${FLOOR42_IMAGE:-ghcr.io/padashtan/floor42:latest}
    pull_policy: missing
    build:
      context: .
      # with-claude-code (the default) adds Claude Code for real agents; floor42 is the published image.
      target: ${FLOOR42_TARGET:-with-claude-code}
      # The commit the image is built from, shown by /api/status (bin/floor42-docker and make docker-build set them).
      args:
        FLOOR42_COMMIT: ${FLOOR42_COMMIT:-}
        FLOOR42_COMMIT_TIME: ${FLOOR42_COMMIT_TIME:-}
        FLOOR42_COMMIT_DIRTY: ${FLOOR42_COMMIT_DIRTY:-}
    ports:
      # Loopback only: other machines on the network never reach the daemon.
      - "127.0.0.1:${FLOOR42_PORT:-7420}:7420"
    volumes:
      # Floor42's data (journal, worktrees) and the Claude Code sign-in, kept across upgrades.
      - office-home:/home/office
      # The folder holding your git repositories, at the same path as on the host, so paths read the same everywhere.
      # Agents' commands reach nothing else of your machine. Inside the container they run as the daemon's own user:
      # they can write Floor42's journal and read the Claude sign-in (docs/docker.md, ADR-0044).
      - ${FLOOR42_PROJECTS:?set FLOOR42_PROJECTS to the folder holding your git repositories}:${FLOOR42_PROJECTS}
    restart: unless-stopped

volumes:
  office-home:
